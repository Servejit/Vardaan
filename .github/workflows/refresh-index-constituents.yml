name: Refresh index constituents

on:
  push:
    paths:
      - "scripts/refresh_index_constituents.py"
      - ".github/workflows/refresh-index-constituents.yml"
  schedule:
    # Run daily; the script refreshes each index only when 15 days have elapsed.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-constituents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Verify and refresh saved constituent lists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/refresh_index_constituents.py
